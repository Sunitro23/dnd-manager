services:
  app:
    build:
      context: .
    image: dnd-manager:latest
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.docker
        required: true
    environment:
      DATABASE_PATH: /data/dnd_manager.sqlite3
      PORTRAIT_PATH: /data/portraits
      PATH_CATALOG_JSON: /data/voies.json
      PORT: "8000"
    expose:
      - "8000"
    volumes:
      - dnd-manager-data:/data
      - ./data/voies.json:/data/voies.json
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      proxy-network:
        aliases:
          - dnd-manager

volumes:
  dnd-manager-data:

networks:
  proxy-network:
    external: true
    name: proxy-network
